{{define "content"}}
<div class="page-header d-print-none">
  <div class="row g-2 align-items-center">
    <div class="col"><div class="page-pretitle">{{.Pretitle}}</div><h2 class="page-title">{{.Title}}</h2></div>
    <div class="col-auto ms-auto"><a href="/admin/pages" class="btn btn-ghost-secondary">返回列表</a></div>
  </div>
</div>
{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
<form method="post" action="{{.ActionURL}}" class="row row-cards">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  {{if .IsEdit}}<input type="hidden" name="_method" value="PUT">{{end}}
  <div class="col-lg-9">
    <div class="card"><div class="card-body">
      <div class="mb-3"><label class="form-label required" for="title">标题</label><input type="text" class="form-control form-control-lg" id="title" name="title" value="{{.Page.Title}}" required maxlength="100"></div>
      <div class="mb-3"><label class="form-label" for="slug">Slug</label><input type="text" class="form-control" id="slug" name="slug" value="{{.Page.Slug}}" maxlength="100" placeholder="留空自动生成"><div class="form-hint">前台地址：/p/{{.Page.Slug}}</div></div>
      <div><label class="form-label required" for="content">正文</label><textarea class="form-control rich-editor" id="content" name="content" rows="18">{{.Page.Content}}</textarea></div>
    </div></div>
    <div class="card mt-3"><div class="card-header"><h3 class="card-title">SEO</h3></div><div class="card-body">
      <div class="mb-3"><input type="text" class="form-control" name="seo_title" value="{{.Page.SeoTitle}}" placeholder="SEO 标题" maxlength="100"></div>
      <div class="mb-3"><input type="text" class="form-control" name="seo_keywords" value="{{.Page.SeoKeywords}}" placeholder="SEO 关键词" maxlength="200"></div>
      <textarea class="form-control" name="seo_description" rows="2" placeholder="SEO 描述" maxlength="255">{{.Page.SeoDescription}}</textarea>
    </div></div>
  </div>
  <div class="col-lg-3">
    <div class="card"><div class="card-body">
      <div class="mb-3"><label class="form-label">状态</label><select class="form-select" name="status"><option value="published" {{if eq (printf "%s" .Page.Status) "published"}}selected{{end}}>发布</option><option value="archived" {{if eq (printf "%s" .Page.Status) "archived"}}selected{{end}}>归档</option></select></div>
      <div><label class="form-label">排序</label><input type="number" class="form-control" name="sort" value="{{.Page.Sort}}"></div>
    </div><div class="card-footer d-grid gap-2"><button class="btn btn-primary" type="submit">保存单页</button><a href="/admin/pages" class="btn btn-ghost-secondary">取消</a></div></div>
  </div>
</form>
{{end}}
