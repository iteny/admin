{{define "content"}}
<div class="page-header d-print-none">
  <div class="row g-2 align-items-center">
    <div class="col"><div class="page-pretitle">{{.Pretitle}}</div><h2 class="page-title">{{.Title}}</h2></div>
    <div class="col-auto ms-auto"><a href="/admin/pages/create" class="btn btn-primary"><i class="ti ti-plus me-1"></i>新增单页</a></div>
  </div>
</div>
<div class="card">
  <div class="card-header">
    <form class="d-flex gap-2" method="get" action="/admin/pages">
      <input type="text" class="form-control" name="keyword" value="{{.QueryValues.Get "keyword"}}" placeholder="搜索标题或 slug">
      <button class="btn btn-primary">搜索</button>
      <a href="/admin/pages" class="btn btn-ghost-secondary">重置</a>
    </form>
  </div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead><tr><th>标题</th><th>Slug</th><th>状态</th><th>排序</th><th>更新时间</th><th class="w-1">操作</th></tr></thead>
      <tbody>
        {{range .Data.List}}
        <tr>
          <td><a href="/admin/pages/{{.ID}}/edit">{{.Title}}</a></td>
          <td class="text-secondary">{{.Slug}}</td>
          <td><span class="badge {{statusClass (printf "%s" .Status)}}">{{statusText (printf "%s" .Status)}}</span></td>
          <td>{{.Sort}}</td>
          <td class="text-secondary">{{fmtTime .UpdatedAt}}</td>
          <td><div class="btn-list flex-nowrap">
            <a href="/admin/pages/{{.ID}}/edit" class="btn btn-sm btn-ghost-secondary">编辑</a>
            <button type="button" class="btn btn-sm btn-ghost-danger confirm-delete" data-url="/admin/pages/{{.ID}}/delete" data-name="{{.Title}}">删除</button>
          </div></td>
        </tr>
        {{else}}
        <tr><td colspan="6" class="text-center text-secondary py-6">暂无单页</td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
  {{template "pagination" .}}
</div>
{{end}}
