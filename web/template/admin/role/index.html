{{define "content"}}
<div class="page-header d-print-none">
  <div class="row g-2 align-items-center">
    <div class="col"><div class="page-pretitle">{{.Pretitle}}</div><h2 class="page-title">{{.Title}}</h2></div>
    <div class="col-auto ms-auto"><a href="/admin/roles/create" class="btn btn-primary"><i class="ti ti-plus me-1"></i>新增角色</a></div>
  </div>
</div>
<div class="card">
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead><tr><th>名称</th><th>标识</th><th>说明</th><th>类型</th><th>操作</th></tr></thead>
      <tbody>
        {{range .Roles}}
        <tr>
          <td class="fw-medium">{{.Name}}</td>
          <td><code>{{.Slug}}</code></td>
          <td class="text-secondary">{{.Description}}</td>
          <td>{{if .IsSystem}}<span class="badge bg-azure-lt">内置</span>{{else}}<span class="badge bg-secondary-lt">自定义</span>{{end}}</td>
          <td><div class="btn-list flex-nowrap">
            <a href="/admin/roles/{{.ID}}/edit" class="btn btn-sm btn-ghost-secondary">编辑</a>
            {{if not .IsSystem}}<button type="button" class="btn btn-sm btn-ghost-danger confirm-delete" data-url="/admin/roles/{{.ID}}/delete" data-name="{{.Name}}">删除</button>{{end}}
          </div></td>
        </tr>
        {{else}}
        <tr><td colspan="5" class="text-center text-secondary py-6">暂无角色</td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
