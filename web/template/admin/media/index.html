{{define "content"}}
<div class="page-header d-print-none">
  <div class="row g-2 align-items-center">
    <div class="col"><div class="page-pretitle">{{.Pretitle}}</div><h2 class="page-title">{{.Title}}</h2></div>
  </div>
</div>
<div class="card mb-3">
  <div class="card-body">
    <form action="/admin/media/upload" class="dropzone" id="media-dropzone">
      <div class="dz-message"><i class="ti ti-cloud-upload" style="font-size:2rem"></i><div class="mt-2">拖拽文件到这里，或点击选择文件</div><div class="text-secondary small mt-1">支持图片，单个文件最大 {{.Site.upload_max_size}} 字节</div></div>
    </form>
  </div>
</div>
<div class="card">
  <div class="card-header">
    <form class="d-flex gap-2" method="get" action="/admin/media">
      <input type="text" class="form-control" name="keyword" value="{{.QueryValues.Get "keyword"}}" placeholder="搜索文件名">
      <select class="form-select w-auto" name="mime">
        <option value="">全部类型</option>
        <option value="image/" {{if eq (.QueryValues.Get "mime") "image/"}}selected{{end}}>图片</option>
      </select>
      <button class="btn btn-primary">筛选</button>
      <a href="/admin/media" class="btn btn-ghost-secondary">重置</a>
    </form>
  </div>
  <div class="card-body">
    <div class="row row-cards">
      {{range .Data.List}}
      <div class="col-6 col-md-4 col-xl-3">
        <div class="card card-sm">
          <div class="card-body p-2 text-center position-relative">
            {{if hasPrefix .MimeType "image/"}}
            <img src="{{thumbURL .URL}}" alt="{{.OriginalName}}" class="img-fluid rounded" style="height:140px;object-fit:cover;width:100%">
            {{else}}
            <div class="text-secondary py-6"><i class="ti ti-file" style="font-size:2rem"></i><div class="mt-2">{{.Ext}}</div></div>
            {{end}}
          </div>
          <div class="card-footer p-2">
            <div class="text-truncate small" title="{{.OriginalName}}">{{.OriginalName}}</div>
            <div class="text-secondary small">{{.Size}} B</div>
            <div class="btn-list mt-2">
              <button type="button" class="btn btn-sm btn-ghost-secondary copy-url" data-url="{{.URL}}">复制 URL</button>
              <button type="button" class="btn btn-sm btn-ghost-danger confirm-delete" data-url="/admin/media/{{.ID}}/delete" data-name="{{.OriginalName}}">删除</button>
            </div>
          </div>
        </div>
      </div>
      {{else}}
      <div class="col-12"><div class="text-center text-secondary py-6"><i class="ti ti-photo" style="font-size:2rem"></i><div class="mt-2">暂无媒体文件</div></div></div>
      {{end}}
    </div>
  </div>
  {{template "pagination" .}}
</div>
{{end}}
