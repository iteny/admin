app:
  name: "Tabler CMS"
  env: "production"
  debug: false
  auto_migrate: false
  seed: false
  timezone: "Asia/Shanghai"
  base_url: "https://cms.example.com"
  upload_max_size: 10485760
  upload_allowed_ext: ["jpg", "jpeg", "png", "gif", "webp"]

server:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s

database:
  driver: "mysql"
  dsn: "cms:change-me@tcp(127.0.0.1:3306)/cms?charset=utf8mb4&parseTime=True&loc=Local"
  max_open: 50
  max_idle: 10
  max_lifetime: 1h

session:
  name: "cms_session"
  secret: "replace-with-a-long-random-secret"
  secure: true

log:
  level: "info"
  dir: "storage/logs"
  file: "cms.log"

mail:
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
