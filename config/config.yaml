app:
  name: "Tabler CMS"
  env: "development"
  debug: true
  auto_migrate: true
  seed: true
  timezone: "Asia/Shanghai"
  base_url: "http://localhost:8080"
  upload_max_size: 10485760
  upload_allowed_ext: ["jpg", "jpeg", "png", "gif", "webp", "svg"]

server:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s

database:
  driver: "sqlite"
  dsn: "storage/cms.db"
  max_open: 50
  max_idle: 10
  max_lifetime: 1h

session:
  name: "cms_session"
  secret: "change-this-session-secret-in-production"
  secure: false

log:
  level: "debug"
  dir: "storage/logs"
  file: "cms.log"

mail:
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
